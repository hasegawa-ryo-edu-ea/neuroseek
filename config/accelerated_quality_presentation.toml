[run]
mode = "full"
seed = 20260810
budget_seconds = 108000
semantic_preparation_max_seconds = 21600

[training]
# Keep the original rollout size so each update has the same sample structure;
# quality is improved through a longer BC bridge and anti-collapse exploration.
batch_size = 16
lr = 0.0003
max_cuda_expand_edges = 262144
navigator_candidate_cap = 256
ppo_entropy_coef = 0.08
ppo_action_temperature = 1.5
# One supervised proof-program anchor after each PPO update prevents a
# transient all-failure rollout from collapsing the strategist to SEED.
rl_bc_anchor_interval = 1

[checkpoint]
seconds = 300
retain_periodic = 24

[storage]
minimum_free_gib = 24

[hardware]
checkpoint_window = 256
sample_interval_seconds = 1.0

[telemetry]
enabled = true
tegrastats_interval_seconds = 10
warning_temperature_c = 80.0
critical_temperature_c = 85.0
critical_action = "checkpoint_stop"

[[phase]]
name = "cuda_search_microbenchmarks"
seconds = 900

[[phase]]
name = "hardware_cost_model"
seconds = 1800

# 34 minutes more BC than the collapsed accelerated attempt.
[[phase]]
name = "behavior_cloning"
seconds = 8000

[[phase]]
name = "rl_2_3_hop"
seconds = 16431

[[phase]]
name = "rl_multihop_distractor"
seconds = 22042

[[phase]]
name = "rl_intersection"
seconds = 16468

[[phase]]
name = "rl_semantic_hybrid"
seconds = 12245

[[phase]]
name = "rl_robustness"
seconds = 10121

[[phase]]
name = "jetson_specialization"
seconds = 12345

[[phase]]
name = "deterministic_final_evaluation"
seconds = 7648
